
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Marks Management System</h1>
        <p class="subtitle">Manage student details and marks</p>

        <!-- Student Form -->
        <section class="card">
            <h2>Enter Student Details</h2>

            <form id="studentForm">
                <div class="form-grid">
                    <div>
                        <label for="rollNo">Roll Number</label>
                        <input type="text" id="rollNo" required>
                    </div>

                    <div>
                        <label for="name">Student Name</label>
                        <input type="text" id="name" required>
                    </div>

                    <div>
                        <label for="studentClass">Class</label>
                        <input type="text" id="studentClass" required>
                    </div>

                    <div>
                        <label for="english">English Marks</label>
                        <input type="number" id="english"
                               min="0" max="100" step="1" required>
                    </div>

                    <div>
                        <label for="maths">Mathematics Marks</label>
                        <input type="number" id="maths"
                               min="0" max="100" step="1" required>
                    </div>

                    <div>
                        <label for="science">Science Marks</label>
                        <input type="number" id="science"
                               min="0" max="100" step="1" required>
                    </div>
                </div>

                <button type="submit">Add Student</button>
                <button type="reset" class="clear-btn">Clear Form</button>
            </form>
        </section>

        <!-- Topper Section -->
        <section class="card">
            <h2>Topper Information</h2>
            <div id="topperInfo">
                No student records available yet.
            </div>
        </section>

        <!-- Student Table -->
        <section class="card">
            <h2>Student Records</h2>
            <p id="studentCount">Total Students: 0</p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Roll No.</th>
                            <th>Name</th>
                            <th>Class</th>
                            <th>English</th>
                            <th>Maths</th>
                            <th>Science</th>
                            <th>Total</th>
                            <th>Percentage</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="studentTable">
                        <tr>
                            <td colspan="9">No records found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
